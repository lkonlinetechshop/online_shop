
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LankaCNC Admin Dashboard</title>
  <link rel="stylesheet" href="admin.css">
</head>
<body>

  <header class="admin-header">
    <h2>LankaCNC Admin</h2>
    <button id="logoutBtn" hidden>Logout</button>
  </header>

  <!-- LOGIN -->
  <section id="loginSection" class="login-box">
    <h2>Admin Login</h2>
    <input type="password" id="adminKey"
      placeholder="Enter your password">
    <button id="loginBtn">Login</button>
    <p id="loginMessage"></p>
  </section>

  <!-- DASHBOARD -->
  <main id="dashboard" hidden>

    <section class="dashboard-top">
      <h2>Product Management</h2>
      <button id="addProductBtn">+ Add Product</button>
    </section>

    <section class="product-form-box" id="productFormBox" hidden>
      <h3 id="formTitle">Add Product</h3>

      <form id="productForm">

        <input type="hidden" id="productId">

        <label>Product Name</label>
        <input id="name" required>

        <label>Category</label>
        <select id="category" required>
          <option value="">Select Category</option>
          <option>CNC Parts</option>
          <option>Pc</option>
          <option>Electronics</option>
          <option>Machineries</option>
          <option>Handcraft</option>
        </select>

        <label>Product Image</label>
        <input type="file" id="imageFile" accept="image/*">
        <img id="imagePreview" alt="Image preview" hidden>

        <label>Image URL</label>
        <input id="image" placeholder="Google Drive image URL">

        <div class="two-columns">
          <div>
            <label>Old Price</label>
            <input type="number" id="oldPrice" min="0">
          </div>
          <div>
            <label>Price</label>
            <input type="number" id="price" min="0" required>
          </div>
        </div>

        <div class="two-columns">
          <div>
            <label>Discount</label>
            <input id="discount" placeholder="10%">
          </div>
          <div>
            <label>Stock Quantity</label>
            <input type="number" id="stock" min="0" value="0">
          </div>
        </div>

        <label>Rating</label>
        <input id="rating" value="★★★★★">

        <label>Description</label>
        <textarea id="description" rows="5"></textarea>

        <label>Manual PDF 1 URL</label>
        <input id="manualPdf1">

        <label>Manual PDF 2 URL</label>
        <input id="manualPdf2">

        <label>Size Options (JSON)</label>
        <textarea id="options" rows="6"
          placeholder='[{"size":"3.175x12mm","price":850,"stock":10}]'></textarea>

        <label class="active-label">
          <input type="checkbox" id="active" checked>
          Show product on website
        </label>

        <div class="form-buttons">
          <button type="submit" id="saveBtn">Save Product</button>
          <button type="button" id="cancelBtn">Cancel</button>
        </div>

        <p id="formMessage"></p>
      </form>
    </section>

    <section class="products-table-box">
      <h3>All Products</h3>
      <input id="searchProducts" placeholder="Search products...">

      <div class="table-scroll">
        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th>Image</th>
              <th>Name</th>
              <th>Price</th>
              <th>Stock</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="productsTable">
            <tr><td colspan="6">Loading...</td></tr>
          </tbody>
        </table>
      </div>
    </section>

  </main>

  <script src="js/products-api.js"></script>
  <script src="js/admin.js"></script>

</body>
</html>
