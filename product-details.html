<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>LankaCNC Product</title>

    <meta
        name="description"
        content="Buy CNC, electronics and PC products from LankaCNC Sri Lanka."
    >

    <meta
        name="author"
        content="LankaCNC.LK"
    >

    <!-- Canonical URL is updated dynamically by product-details.js -->
    <link
        id="canonical-url"
        rel="canonical"
    >

    <!-- Open Graph -->
    <meta
        property="og:type"
        content="product"
    >

    <meta
        property="og:site_name"
        content="LankaCNC.LK"
    >

    <meta
        property="og:title"
        content="LankaCNC Product"
    >

    <meta
        property="og:description"
        content="CNC, electronics and PC products in Sri Lanka."
    >

    <meta
        property="og:image"
        content="https://www.lankacnc.lk/images/logo.png"
    >

    <meta
        property="og:url"
        content="https://www.lankacnc.lk/"
    >

    <!-- CSS -->
    <link
        rel="stylesheet"
        href="style.css"
    >

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
    >

</head>


<body>


    <!-- ==========================================
         HEADER
    ========================================== -->

    <header>

        <button
            class="menu-toggle"
            id="menu-toggle"
            aria-label="Open Menu"
        >
            <i class="fa-solid fa-bars"></i>
        </button>


        <div class="logo">

            <a href="index.html">

                <img
                    src="images/logo.png"
                    alt="LankaCNC Logo"
                >

                <div>

                    <h2>
                        LankaCNC<span>.lk</span>
                    </h2>

                    <h5>
                        PRECISION ENGINEERING SOLUTIONS
                    </h5>

                </div>

            </a>

        </div>


        <!-- Navigation -->

        <nav id="nav-menu">

            <a href="index.html">
                Home
            </a>

            <a href="index.html">
                Products
            </a>

            <a href="contact.html">
                Contact
            </a>

            <a href="about.html">
                About Us
            </a>


            <!-- Authentication -->

            <a
                href="signin.html"
                id="signin-link"
            >
                Sign In
            </a>

            <span id="user-status"></span>

            <button
                id="logout-btn"
                style="display:none;"
            >
                Logout
            </button>

            <a
                href="admin.html"
                id="admin-link"
                style="display:none;"
            >
                Admin
            </a>

        </nav>


        <!-- Cart -->

        <div class="cart-icon">

            <a href="cart.html">

                <i class="fa-solid fa-cart-shopping"></i>

            </a>

        </div>

    </header>



    <!-- ==========================================
         PRODUCT DETAILS
    ========================================== -->

    <section class="product-details-container">

        <div id="product-details">

            <!-- Product loads dynamically here -->

        </div>

    </section>



    <!-- ==========================================
         FOOTER
    ========================================== -->

    <footer>

        <div class="footer-links">

            <a href="about.html">
                About
            </a>

            <a href="privacy.html">
                Privacy Policy
            </a>

            <a href="terms.html">
                Terms &amp; Conditions
            </a>

            <a href="contact.html">
                Contact
            </a>

        </div>

        <p>
            &copy; 2026 LankaCNC.LK Sri Lanka.
            All Rights Reserved.
        </p>

    </footer>



    <!-- ==========================================
         PRODUCT STRUCTURED DATA
    ========================================== -->

    <script
        type="application/ld+json"
        id="product-schema"
    >
    {
        "@context": "https://schema.org",
        "@type": "Product",
        "name": "LankaCNC Product"
    }
    </script>



    <!-- ==========================================
         JAVASCRIPT
         
         IMPORTANT:
         auth-api.js must load before
         product-details.js if product-details.js
         uses authentication functions.
    ========================================== -->

    <script src="js/menu.js"></script>

    <script src="js/auth-api.js"></script>

    <script src="js/auth.js"></script>

    <script src="js/product-details.js"></script>


</body>

</html>
