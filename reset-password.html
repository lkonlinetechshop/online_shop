<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Reset Password</title>

</head>


<body>

    <div class="auth-container">

        <h1>Reset Password</h1>


        <form id="reset-password-form">

            <input
                type="password"
                id="password"
                placeholder="New Password"
                minlength="6"
                required
            >


            <input
                type="password"
                id="confirmPassword"
                placeholder="Confirm New Password"
                minlength="6"
                required
            >


            <button type="submit">
                Change Password
            </button>

        </form>


        <p>
            <a href="signin.html">
                Back to Sign In
            </a>
        </p>

    </div>


    <script src="js/reset-password.js"></script>

</body>

</html>
