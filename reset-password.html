<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - LANKACNC.LK</title>
    <link rel="stylesheet" href="forgot.css">
    <meta name="description" content="Reset your LANKACNC.LK account password.">
</head>
<body>
<div class="auth-container">
    <h1>Reset Password</h1>

    <form id="reset-password-form" novalidate>
        <input type="password" id="password" placeholder="New Password" autocomplete="new-password" minlength="8" required>
        <input type="password" id="confirmPassword" placeholder="Confirm New Password" autocomplete="new-password" minlength="8" required>
        <button type="submit">Change Password</button>
    </form>

    <p><a href="signin.html">Back to Sign In</a></p>
</div>

<script src="js/auth-api.js"></script>
<script src="js/reset-password.js"></script>
</body>
</html>
