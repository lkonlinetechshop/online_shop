<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - LankaCNC | CNC, Electronics & PC Products in Sri Lanka</title>
    <link rel="stylesheet" href="signin.css">
</head>
<body>
<div class="signin-container">
    <h2>Sign In</h2>

    <form id="signin-form" novalidate>
        <input type="email" id="email" placeholder="Email Address" autocomplete="email" required>
        <div class="password-wrapper" style="position:relative;">
            <input type="password" id="password" placeholder="Password" autocomplete="current-password" required style="width:100%;box-sizing:border-box;padding-right:45px;">
            <button type="button" id="togglePassword" aria-label="Show password" style="position:absolute;right:10px;top:50%;transform:translateY(-50%);border:0;background:transparent;cursor:pointer;font-size:18px;padding:4px;">👁️</button>
        </div>

        <a href="forgot-password.html" class="forgot-link">Forgot Password?</a>

        <button type="submit">Sign In</button>
    </form>

    <p>
        Don't have an account?
        <a href="signup.html">Register</a>
    </p>
</div>

<script src="js/auth-api.js"></script>
<script src="js/signin.js"></script>
<script src="js/auth.js"></script>
<script>document.getElementById("togglePassword").addEventListener("click",function(){const p=document.getElementById("password"),h=p.type==="password";p.type=h?"text":"password";this.textContent=h?"🙈":"👁️";this.setAttribute("aria-label",h?"Hide password":"Show password");});</script>
</body>
</html>
